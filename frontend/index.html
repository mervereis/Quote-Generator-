<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <h1>Quote Generator</h1>


    <section class="quote-section">
      <p id="quote">Click the button to get a quote</p>
      <p id="author"></p>

      <button id="new-quote-button">New Quote</button>
    </section>


    <section class="add-quote-section">
      <h2>Add Your Own Quote</h2>

      <form id="quote-form">

        <label for="author-input">Author</label>
        <input id="author-input" type="text" placeholder="Enter author" required>

        <label for="quote-input">Quote</label>
        <textarea id="quote-input" placeholder="Enter quote" required></textarea>

        <button type="submit">Add Quote</button>

      </form>

      <p id="message"></p>
    </section>
  </main>

  <script src="frontend.js"></script>

</body>

</html>
